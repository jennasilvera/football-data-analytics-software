name: Football Data Analytics CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e .

      - name: Run Ruff linting
        run: ruff check .

      - name: Run V2 static type checks
        run: mypy src/football_analytics

      - name: Run tests
        run: pytest

      - name: Run native V2 research pipeline
        run: make demo-v2

      - name: Run paired V2 model comparison
        run: make demo-v2-comparison

      - name: Compare native competition frequency baseline
        run: make demo-v2-competition

      - name: Compare confederation baseline and historical slices
        run: make demo-v2-confederations

      - name: Run nested temporal probability research
        run: make demo-v2-nested

      - name: Run native operational acceptance and recovery
        run: make demo-platform

      - name: Run legacy sample forecasting pipeline
        run: |
          python -m wc_forecast health
          python -m wc_forecast ingest-results data/sample/historical_results_sample.csv
          python -m wc_forecast build-elo
          python -m wc_forecast build-features
          python -m wc_forecast backtest-logistic
          python -m wc_forecast report-backtest
          python -m wc_forecast predict-poisson Argentina France
          python -m wc_forecast report-match Argentina France
          python -m wc_forecast evaluate-market Argentina France --home-odds 2.20 --draw-odds 3.40 --away-odds 3.50
          python -m wc_forecast batch-evaluate-market data/sample/market_odds_sample.csv
          python -m wc_forecast apply-strategy-policy outputs/batch_market_edges.csv
          python -m wc_forecast size-stakes outputs/strategy_policy_edges.csv
          python -m wc_forecast log-batch-predictions outputs/stake_sizing_edges.csv
          python -m wc_forecast settle-batch-predictions data/sample/settlement_results_sample.csv
          python -m wc_forecast log-prediction Argentina France --home-odds 2.20 --draw-odds 3.40 --away-odds 3.50
          PREDICTION_ID=$(tail -n 1 outputs/prediction_ledger.csv | cut -d',' -f1)
          python -m wc_forecast settle-prediction "$PREDICTION_ID" \
            --final-home-score 1 \
            --final-away-score 1 \
            --closing-home-odds 2.10 \
            --closing-draw-odds 3.25 \
            --closing-away-odds 3.60
          python -m wc_forecast report-ledger
          python -m wc_forecast simulate-group-stage --n-simulations 100
          python -m wc_forecast report-group-stage
          make demo

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start native services
        env:
          FOOTBALL_API_KEY: ci-only-container-smoke-key-not-for-deployment
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Check service boundaries
        env:
          FOOTBALL_API_KEY: ci-only-container-smoke-key-not-for-deployment
        run: |
          curl --fail http://127.0.0.1:8000/health
          curl --fail http://127.0.0.1:8501/_stcore/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/teams)" = "401"
          test "$(docker compose exec -T api id -u)" = "10001"
      - name: Container logs and cleanup
        if: always()
        env:
          FOOTBALL_API_KEY: ci-only-container-smoke-key-not-for-deployment
        run: |
          docker compose logs
          docker compose down --volumes
